apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k-view.fullname" . }}
  labels:
    {{- include "k-view.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "k-view.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "k-view.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k-view.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.image.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          env:
            {{- include "k-view.commonEnv" . | nindent 12 }}
            {{- if .Values.enable_sso }}
            - name: KVIEW_OAUTH_REDIRECT_URL
              value: {{ .Values.env.oauthRedirectUrl }}
            - name: KVIEW_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-view.secretName" . }}
                  key: googleClientId
            - name: KVIEW_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-view.secretName" . }}
                  key: googleClientSecret
            {{- end }}
            {{- if or .Values.localUsers .Values.secrets.existingSecret }}
            - name: KVIEW_STATIC_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-view.secretName" . }}
                  key: KVIEW_STATIC_USERS
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.rbac.enabled }}
            - name: rbac-config
              mountPath: /etc/kview/rbac
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "k-view.fullname" . }}-pvc
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.rbac.enabled }}
        - name: rbac-config
          configMap:
            name: {{ include "k-view.fullname" . }}-rbac-config
        {{- end }}
