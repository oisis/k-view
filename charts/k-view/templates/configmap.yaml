{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k-view.fullname" . }}-rbac-config
  labels:
    {{- include "k-view.labels" . | nindent 4 }}
data:
  assignments.yaml: |
    assignments:
{{- range .Values.rbac.assignments }}
{{- $role := .roleName }}
{{- $ns := .namespace }}
{{- $sType := .subjectType }}
{{- range .subjects }}
      - {{ if eq $sType "User" }}user{{ else }}group{{ end }}: {{ . | quote }}
        role: {{ $role | quote }}
{{- if $ns }}
        namespace: {{ $ns | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.localUsers }}
{{- if .role }}
      - user: {{ .username | quote }}
        role: {{ .role | quote }}
{{- if .namespace }}
        namespace: {{ .namespace | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
