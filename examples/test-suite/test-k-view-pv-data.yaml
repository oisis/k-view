apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-pv-with-data
  labels:
    app: test-k-view
    tier: platinum
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: test-k-view-storageclass
  mountOptions:
    - debug
    - rw
    - noatime
  claimRef:
    name: test-k-view-pvc
    namespace: k-view-test-data
  hostPath:
    path: "/tmp/k-view-data-v2"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - docker-desktop
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-csi-pv-with-data
  labels:
    app: test-k-view
    type: csi
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: test-k-view-storageclass
  csi:
    driver: hostpath.csi.k8s.io
    volumeHandle: csi-hostpath-volume-unique-id-001
    volumeAttributes:
      region: eu-central-1
      encrypted: "true"
      storage.kubernetes.io/csiProvisionerIdentity: 123456789-unique
