apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-k-view-networkpolicy
  namespace: k-view-test-data
  labels:
    app: test-k-view
    security: strict
  annotations:
    k-view.io/description: "Isolation policy for backend services"
    k-view.io/security-level: "high"
    kubernetes.io/description: "Allow only test-deploy traffic"
spec:
  podSelector:
    matchLabels:
      app: test-k-view
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: test-k-view-deploy
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
