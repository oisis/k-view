apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-k-view-networkpolicy
  namespace: k-view-test-data
  labels:
    app: test-k-view
    security: strict
  annotations:
    k-view.io/description: "Isolation policy for backend services"
    k-view.io/security-level: "high"
    kubernetes.io/description: "Allow only test-deploy traffic"
spec:
  podSelector:
    matchLabels:
      app: test-k-view
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: test-k-view-deploy
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
