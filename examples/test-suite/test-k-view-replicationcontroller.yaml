apiVersion: v1
kind: ReplicationController
metadata:
  name: test-k-view-replicationcontroller
  namespace: k-view-test-data
  labels:
    app: test-k-view-rc
    legacy: "true"
  annotations:
    k-view.io/description: "Legacy workload test for backward compatibility"
    k-view.io/migration-status: "pending"
spec:
  replicas: 1
  selector:
    app: test-k-view-rc
  template:
    metadata:
      labels:
        app: test-k-view-rc
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
