apiVersion: v1
kind: Pod
metadata:
  name: test-k-view-standalone-pod
  namespace: k-view-test-data
  labels:
    app: test-k-view
    type: standalone
    tier: test
  annotations:
    k-view.io/purpose: "Test standalone pod rendering"
spec:
  containers:
  - name: web
    image: nginx:alpine
    resources:
      limits:
        cpu: "200m"
        memory: "128Mi"
      requests:
        cpu: "100m"
        memory: "64Mi"
