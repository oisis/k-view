apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-k-view-ingress
  namespace: k-view-test-data
  labels:
    app: test-k-view
    tier: edge
    ssl: enabled
  annotations:
    k-view.io/description: "External entry point for testing routing and TLS"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  rules:
  - host: test.k-view.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-k-view-service
            port:
              number: 80
