apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-k-view-clusterrolebinding
  labels:
    app: test-k-view
  annotations:
    k-view.io/description: "Binding for cluster-wide permissions"
subjects:
- kind: ServiceAccount
  name: test-k-view-serviceaccount
  namespace: k-view-test-data
roleRef:
  kind: ClusterRole
  name: test-k-view-clusterrole
  apiGroup: rbac.authorization.k8s.io
