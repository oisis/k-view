apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-k-view-hpa
  namespace: k-view-test-data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-k-view-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
