apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-k-view-deployment
  namespace: k-view-test-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-k-view-deploy
  template:
    metadata:
      labels:
        app: test-k-view-deploy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
